name: LIU BEIHE Notion → GitHub Publisher

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: liu-beihe-notion-publisher
  cancel-in-progress: false

jobs:
  sync-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATA_SOURCE_ID: 7e2c17cf-b76f-4b0b-bd6c-b54dbaaaa98c
      SITE_URL: https://sqliukunsq-cmyk.github.io/liu-beihe-archive
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install publisher dependencies
        run: pip install --upgrade requests markdown

      - name: Sync Notion knowledge base
        run: python scripts/sync_notion_to_github.py

      - name: Commit synced research
        run: |
          git config user.name "LIU BEIHE Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Notion changes to publish."
          else
            git commit -m "Sync LIU BEIHE research from Notion $(date +%F-%H%M)"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
